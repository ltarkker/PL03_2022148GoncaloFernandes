<!DOCTYPE html>

<head>

    <title>PL03 · Quem ganha?</title>

        p { color: black; }
        .info { color: green; }
        #p3 { color: red; }
        div p { color: purple; }
        .info.forte { color: orange; }
        p { color: blue; }
    </style>
</head>
<body>
    <p>Parágrafo 1</p>
    <p class="info">Parágrafo 2</p>

    <div>
        <p>Parágrafo 4</p>
        <p class="info">Parágrafo 5</p>
        <p class="info forte">Parágrafo 6</p>
    </div>
</body>
