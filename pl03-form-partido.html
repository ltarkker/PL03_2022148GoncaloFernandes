<h1>Pedido de contacto</h1>
<form action="https://httpbin.org/get" method="get">
    <p>
      <label for="nome">Nome</label>
      <input type="text" id="nome-completo" name="nome">
    </p>
    <p>
      <input type="email" placeholder="Email" name="email">
    </p>
    <p>
      <label for="tel">Telemóvel</label>
      <input type="number" id="tel" name="tel">
    </p>
    <p>Preferência de contacto:</p>
    <p>
      <label><input type="radio" name="pref-email" value="email"> Email</label>
      <label><input type="radio" name="pref-tel" value="tel"> Telefone</label>
    </p>
    <p>
      <label for="assunto">Assunto</label>
      <textarea id="assunto"></textarea>
    </p>
    <button type="submit">Enviar</button>
</form>
