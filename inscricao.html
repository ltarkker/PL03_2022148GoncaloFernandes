<!DOCTYPE html>
<!-- PL03 · Gonçalo Fernandes · nº 2022148 · 2026-11-04 -->
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gonçalo Fernandes · Inscrição no Workshop de Web</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header id="topo">
        <h1>Gonçalo Fernandes</h1>

        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="inscricao.html">Inscrição</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Inscrição no Workshop de Web</h2>

        <form class="cartao" action="https://httpbin.org/get" method="get">
            <p>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required minlength="3" autocomplete="name">
            </p>

            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="nome@exemplo.pt" autocomplete="email">
            </p>

            <p>
                <label for="numero">N.º de estudante</label>
                <input type="text" id="numero" name="numero" required pattern="[0-9]{7}" inputmode="numeric"
                       placeholder="2026123" title="Exactamente 7 algarismos, por exemplo 2026123">
            </p>

            <p>
                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="nascimento" min="1950-01-01" max="2010-12-31">
            </p>

            <p>
                <label for="curso">Curso</label>
                <select id="curso" name="curso">
                    <option value="LEI">Licenciatura em Engenharia Informática</option>
                    <option value="CTeSP-DS">CTeSP em Desenvolvimento de Software</option>
                    <option value="outro">Outro</option>
                </select>
            </p>

            <fieldset>
                <legend>Turno</legend>
                <label class="opcao"><input type="radio" name="turno" value="diurno" checked> Diurno</label>
                <label class="opcao"><input type="radio" name="turno" value="pos-laboral"> Pós-laboral</label>
            </fieldset>

            <fieldset>
                <legend>Interesses</legend>
                <label class="opcao"><input type="checkbox" name="interesses" value="web"> Web</label>
                <label class="opcao"><input type="checkbox" name="interesses" value="ia"> Inteligência artificial</label>
                <label class="opcao"><input type="checkbox" name="interesses" value="ciberseguranca"> Cibersegurança</label>
            </fieldset>

            <p>
                <label for="mensagem">Mensagem (opcional)</label>
                <textarea id="mensagem" name="mensagem" rows="4" maxlength="300"></textarea>
            </p>

            <p>
                <label class="opcao"><input type="checkbox" name="regras" value="aceito" required> Li e aceito as regras do workshop</label>
            </p>

            <p>
                <button type="submit">Inscrever</button>
                <button type="reset" class="secundario">Limpar</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Gonçalo Fernandes</p>
        <p>Tecnologias da Internet I</p>
    </footer>
</body>
</html>
